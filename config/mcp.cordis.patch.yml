# 需要安装 tesseract（pkg install tesseract）和 python3。
- id: mcp-vision
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: vision
    transport: stdio
    command: python3
    args:
      - {{MCP_SCRIPTS_DIR}}/vision-mcp.py
    toolCallTimeoutMs: 120000
    failOnStartupError: false
    reconnect:
      enabled: true
      initialDelayMs: 500
      maxDelayMs: 30000
      maxAttempts: 3

