# DeepSeek Harness MCP 服务器配置（Android/Termux）
# 安装到 ~/.dsh/profiles/web/cordis.patch.yml 的 sandbox-policy 之后
#
# 由 setup.sh 渲染：{{PLACEHOLDER}} 在安装时替换为实际值。
# 每个 MCP 服务器连接外部工具服务器，将其工具注册为
# mcp__<serverName>__<rawName> 供模型使用。
#
# 配置说明：
#   failOnStartupError: false  → 该服务器连接失败时不阻塞整体启动
#   reconnect.enabled: true    → 断线后自动重连（指数退避）
#
# 查看已注册的 MCP 工具：在 Web UI 中查看 /tools 页面或检查日志。
# 禁用某个 MCP：在对应行前加 # 注释，重启 dsh 生效。
# 添加更多 MCP：参考 @deepseek-ai/dsh-mcp-client 文档，按此格式追加。
# =============================================================================

# ── MCP: GitHub ──────────────────────────────────────────────────────────────
# 提供 GitHub API 访问（issue/PR/repo 搜索等），需要 GITHUB_TOKEN 环境变量。
# 未设置 GITHUB_TOKEN 时此服务器不会启动（由 setup.sh 根据环境变量决定是否渲染）。
- id: mcp-github
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: github
    transport: stdio
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-github'
    env:
      GITHUB_TOKEN: {{GITHUB_TOKEN}}
    toolCallTimeoutMs: 120000
    failOnStartupError: false
    reconnect:
      enabled: true
      initialDelayMs: 500
      maxDelayMs: 30000
      maxAttempts: 5

# ── MCP: Filesystem ──────────────────────────────────────────────────────────
# 提供结构化文件系统访问（读/写/搜索/目录列表），限定在 HOME 目录下。
# 补充 dsh 内置的 tool-fs 工具，提供更细粒度的文件操作。
- id: mcp-filesystem
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: filesystem
    transport: stdio
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-filesystem'
      - {{HOME}}
    toolCallTimeoutMs: 30000
    failOnStartupError: false
    reconnect:
      enabled: true
      initialDelayMs: 500
      maxDelayMs: 30000
      maxAttempts: 5

